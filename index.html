  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0F0F0F;
      overflow-x: hidden;
    }

    body {
      box-sizing: border-box;
      min-height: 100vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      box-sizing: border-box;
    }

    .font-display { font-family: 'Playfair Display', Georgia, serif; }
    .font-body { font-family: 'DM Sans', 'Helvetica Neue', sans-serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up {
      animation: fadeUp 0.15s ease-out forwards;
      opacity: 0;
      will-change: opacity, transform;
    }

    .delay-1 { animation-delay: 0.01s; }
    .delay-2 { animation-delay: 0.02s; }
    .delay-3 { animation-delay: 0.03s; }
    .delay-4 { animation-delay: 0.04s; }
    .delay-5 { animation-delay: 0.05s; }
    .delay-6 { animation-delay: 0.06s; }

    .menu-category { scroll-margin-top: 80px; }

    .btn-action {
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      will-change: transform;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    .diamond-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 0;
    }

    .diamond-divider span {
      width: 6px;
      height: 6px;
      background: #F2C744;
      transform: rotate(45deg);
      display: inline-block;
    }

    .diamond-divider span:nth-child(2) {
      width: 8px;
      height: 8px;
    }

    .menu-item-row {
      transition: background 0.15s ease-out;
      -webkit-user-select: none;
      user-select: none;
    }

    .menu-item-row:active {
      background: rgba(242, 199, 68, 0.08);
    }

    .language-selector {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 50;
      background: rgba(26, 26, 26, 0.85);
      backdrop-filter: blur(6px);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(242, 199, 68, 0.25);
    }

    .lang-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 7px;
      transition: all 0.15s ease-out;
      background: transparent;
      padding: 0;
      font-size: 24px;
      line-height: 1;
      will-change: transform, border-color, background, box-shadow;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    .lang-btn.active {
      border-color: #F2C744;
      background: rgba(242, 199, 68, 0.18);
      color: #F2C744;
      box-shadow: 0 0 12px rgba(242, 199, 68, 0.15);
    }

    .lang-btn:active {
      transform: scale(0.95);
    }

    .lang-btn.active:active {
      color: #F2C744;
      box-shadow: 0 0 16px rgba(242, 199, 68, 0.2);
    }

    .menu-item-subtitle {
      font-size: 0.75rem;
      color: rgba(250, 246, 238, 0.6);
      font-style: italic;
      margin-top: 2px;
      line-height: 1.35;
    }

    .icon-red {
      color: #EF3340;
      stroke: #EF3340;
    }

    .icon-gold {
      color: #F2C744;
      stroke: #F2C744;
    }
  </style>

      }

    function detectLanguage() {
      const saved = localStorage.getItem('bistro_lang');
      if (saved && ['fr', 'es', 'en', 'nl'].includes(saved)) return saved;

      const browserLang = (navigator.language || 'es').substring(0, 2).toLowerCase();
      const supportedLangs = ['fr', 'es', 'en', 'nl'];

      return supportedLangs.includes(browserLang) ? browserLang : 'es';
    }

    let currentLang = detectLanguage();

    const categoryIcons = {
      snacks: 'utensils-crossed',
      entrees: 'soup',
      plats: 'chef-hat',
      moules: 'fish',
      desserts: 'cake',
      crepes: 'circle',
      suggestions: 'star',
      supplements: 'plus-circle',
      boissons: 'glass-water',
      allergenes: 'alert-triangle'
    };

    function renderMenuItem(item, t) {
      const itemData = t.items[item.id];
      if (!itemData) return '';

      let priceDisplay = '';

      if (item.noPrice) {
        priceDisplay = '';
      } else if (item.price) {
        priceDisplay = `<span class="text-sm font-semibold text-gold ml-4 whitespace-nowrap">${item.price}</span>`;
      } else {
        priceDisplay = `<span class="text-sm font-semibold text-gold ml-4 whitespace-nowrap">${t[item.specialPriceText]}</span>`;
      }

      return `
        <div class="menu-item-row flex justify-between items-baseline py-2.5 px-3 rounded-lg">
          <div class="flex-1">
            <span class="text-sm text-cream/90">${itemData.name}</span>
            ${itemData.subtitle ? `<div class="menu-item-subtitle">${itemData.subtitle}</div>` : ''}
          </div>
          ${priceDisplay}
        </div>
      `;
    }

    function getCategoryIconClass(categoryKey) {
      return categoryKey === 'allergenes' ? 'icon-gold' : 'icon-red';
    }

    function renderCategory(categoryKey, categoryLabel, t) {
      const items = menuData[categoryKey];
      if (!items) return '';

      const icon = categoryIcons[categoryKey] || 'utensils-crossed';
      const iconClass = getCategoryIconClass(categoryKey);

      if (items.length === 0) {
        return `
          <div class="menu-category mb-8" id="menu-${categoryKey}">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-8 h-8 rounded-lg bg-gold/10 border border-gold/20 flex items-center justify-center flex-shrink-0">
                <i data-lucide="${icon}" class="w-4 h-4 ${iconClass}"></i>
              </div>
              <h3 class="font-display text-lg font-bold text-cream tracking-wide uppercase">${categoryLabel}</h3>
              <div class="flex-1 h-px bg-gold/20"></div>
            </div>
            <div class="text-center py-8">
              <p class="text-sm text-cream/50 italic">${t.comingSoon}</p>
            </div>
          </div>
        `;
      }

      const itemsHTML = items.map(item => renderMenuItem(item, t)).join('');

      return `
        <div class="menu-category mb-8" id="menu-${categoryKey}">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-8 h-8 rounded-lg bg-gold/10 border border-gold/20 flex items-center justify-center flex-shrink-0">
              <i data-lucide="${icon}" class="w-4 h-4 ${iconClass}"></i>
            </div>
            <h3 class="font-display text-lg font-bold text-cream tracking-wide uppercase">${categoryLabel}</h3>
            <div class="flex-1 h-px bg-gold/20"></div>
          </div>
          <div class="space-y-1">
            ${itemsHTML}
          </div>
        </div>
      `;
    }

function renderDrinkHeader(id,labelKey,t,icon='glass-water',backId='') {
  const back = backId ? `<button class="btn-action mb-3 text-xs text-gold underline" onclick="document.getElementById('${backId}').scrollIntoView({behavior:'smooth'})">${beverageLabels.back[currentLang]}</button>` : '';
  return `${back}<div class="flex items-center gap-3 mb-4"><div class="w-8 h-8 rounded-lg bg-gold/10 border border-gold/20 flex items-center justify-center flex-shrink-0"><i data-lucide="${icon}" class="w-4 h-4 icon-red"></i></div><h3 class="font-display text-lg font-bold text-cream tracking-wide uppercase">${beverageLabels[labelKey][currentLang]}</h3><div class="flex-1 h-px bg-gold/20"></div></div>`;
}

function renderDrinkItem(item,t) {
  const name = item.names[currentLang] || item.names.fr;
  const note = item.brandAsk ? `<div class="text-xs text-cream/50 mt-1">${beverageLabels.brandNote[currentLang]}</div>` : '';
  return `<div class="menu-item-row flex justify-between items-baseline py-2.5 px-3 rounded-lg"><div class="flex-1 min-w-0"><span class="text-sm text-cream/90 break-words">${name}</span>${note}</div><span class="text-sm font-semibold text-gold ml-4 whitespace-nowrap">${item.price}</span></div>`;
}

function renderDrinkList(id,labelKey,items,t,backId='menu-boissons',icon='glass-water') {
  return `<div class="menu-category mb-8" id="${id}">${renderDrinkHeader(id,labelKey,t,icon,backId)}<div class="space-y-1">${items.map(item => renderDrinkItem(item,t)).join('')}</div></div>`;
}

function renderBeerCategory(t) {
  return `<div class="menu-category mb-8" id="menu-beers">${renderDrinkHeader('menu-beers','beers',t,'beer','')}<div class="space-y-1">${beverageCatalog.beers.map(item => renderDrinkItem(item,t)).join('')}</div></div>`;
}

function renderBeverages(t) {
  const nav = [['softs','softs'],['aperitifs','aperitifs'],['wines','wines'],['spirits','spirits'],['coffees','coffees']].map(([id,key]) => `<button class="btn-action px-4 py-2.5 rounded-lg border-2 border-gold/60 text-xs font-medium text-cream hover:border-gold hover:bg-gold/10" onclick="document.getElementById('menu-boissons-${id}').scrollIntoView({behavior:'smooth'})">${beverageLabels[key][currentLang]}</button>`).join('');
  const wineNav = [['wines_by_glass','winesByGlass'],['wines_by_bottle','winesByBottle']].map(([id,key]) => `<button class="btn-action px-4 py-2.5 rounded-lg border border-gold/40 text-xs font-medium text-cream hover:border-gold hover:bg-gold/10" onclick="document.getElementById('menu-boissons-${id}').scrollIntoView({behavior:'smooth'})">${beverageLabels[key][currentLang]}</button>`).join('');
  return `<div class="menu-category mb-8" id="menu-boissons">${renderDrinkHeader('menu-boissons','beverages',t,'glass-water','')}<div class="mb-5 rounded-lg bg-darkCard border border-gold/20 p-4"><p class="text-sm text-cream/80">${beverageLabels.payment[currentLang]}</p></div><div class="flex justify-center gap-3 flex-wrap mb-6">${nav}</div>${renderDrinkList('menu-boissons-softs','softs',beverageCatalog.softs,t,'menu-boissons','glass-water')}${renderDrinkList('menu-boissons-aperitifs','aperitifs',beverageCatalog.aperitifs,t,'menu-boissons','wine') }<div class="menu-category mb-8" id="menu-boissons-wines">${renderDrinkHeader('menu-boissons-wines','wines',t,'wine','menu-boissons')}<div class="flex justify-center gap-3 flex-wrap mb-6">${wineNav}</div>${renderDrinkList('menu-boissons-wines-by-glass','winesByGlass',beverageCatalog.winesByGlass,t,'menu-boissons-wines','wine')}${renderDrinkList('menu-boissons-wines-by-bottle','winesByBottle',beverageCatalog.winesByBottle,t,'menu-boissons-wines','wine')}</div>${renderDrinkList('menu-boissons-spirits','spirits',beverageCatalog.spirits,t,'menu-boissons','glass-water')}${renderDrinkList('menu-boissons-coffees','coffees',beverageCatalog.coffees,t,'menu-boissons','coffee')}</div>`;
}


    function renderAllergenSection(t) {
      const allergensList = t.allergens.map(allergen => `

      return `

              <i data-lucide="${categoryIcons.allergenes}" class="w-4 h-4 icon-gold"></i>
            </div>
            <h3 class="font-display text-lg font-bold text-cream tracking-wide uppercase">${t.allergenTitle}</h3>

          <div class="p-4 rounded-lg bg-darkCard border border-gold/20">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">

            </div>
          </div>
        </div>

    }

    function renderMenu() {
      const t = translations[currentLang];
      const wrapper = document.getElementById('app-wrapper');

      const menuHTML = `
        ${renderCategory('snacks', t.snacks, t)}
        ${renderCategory('entrees', t.entrees, t)}

              <i data-lucide="map-pin" class="w-5 h-5 text-gold group-hover:scale-110 transition-transform"></i>

        </section>

        <section class="px-6 py-6 animate-fade-up delay-2">
          <div class="space-y-3">
            <div class="flex items-start gap-3 p-4 rounded-lg bg-darkCard border border-gold/20">
              <i data-lucide="info" class="w-5 h-5 text-gold flex-shrink-0 mt-0.5"></i>
              <p class="text-sm text-cream/80">${t.noticeAllFries}</p>

                <h4 class="font-display text-sm font-bold text-gold uppercase tracking-wider">${t.hours}</h4>
              </div>

      if (window.lucide) {
        requestAnimationFrame(() => {
          lucide.createIcons();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMenu();

      const detectedLangBtn = document.querySelector(`[data-lang="${currentLang}"]`);
      if (detectedLangBtn) {
        detectedLangBtn.classList.add('active');
      }

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const lang = e.currentTarget.dataset.lang;
          localStorage.setItem('bistro_lang', lang);

          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');

          currentLang = lang;
          renderMenu();
          window.scrollTo(0, 0);
        });
      });
    });
  </script>
